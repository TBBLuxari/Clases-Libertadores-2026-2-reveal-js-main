<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Programación para Videojuegos — Clase 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">

  <link rel="stylesheet" href="../../styles/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

  <body>


    <div class="reveal">
      <div class="slides">

        <section>
          <div class="titulo">Clase 1</div>
        </section>

      </div>
    </div>

    <!-- //////////////////////////////////////////////////////////// -->
    <script src="../../node_modules/reveal.js/dist/reveal.js"></script>
    <script src="../../node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="../../node_modules/reveal.js/plugin/highlight/highlight.js"></script>
    <script src="../../node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script src="../../assets/progreso.js"></script>
    <script>
            Reveal.initialize({
              hash: true,
              width: "100%",
              height: "100%",
              margin: 0,
              plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
            });
            function ytCommand(iframe, func)
            {
              if (iframe && iframe.src.includes('youtube.com/embed'))
              {
                iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*');
              }
            }

            Reveal.on('slidechanged', event =>
            {
              const prevVideo = event.previousSlide?.querySelector('video');
              if (prevVideo)
              {
                prevVideo.pause();
                prevVideo.currentTime = 0;
              }
              ytCommand(event.previousSlide?.querySelector('iframe'), 'pauseVideo');

              const video = event.currentSlide.querySelector('video');
              if (video)
              {
                video.currentTime = 0;
                video.play();
              }
              ytCommand(event.currentSlide.querySelector('iframe'), 'playVideo');
          });
    </script>


  </body>

</html>
