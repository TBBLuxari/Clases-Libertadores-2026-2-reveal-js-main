<script>
const NAMES = {"n0":"Positivo (+6 V)","n1":"Negativo (GND)","n2":"Emisor izquierdo: R1 y el LED IR","n3":"Punto N del sensor izquierdo: receptor y R3"};
const HAS_FOCUS = '1' === '1';
const svg = document.getElementById('board');
// vista completa = caja real del dibujo con margen parejo, así queda centrada
const BOX = (() => { const b = svg.getBBox(), m = 24; return { x: b.x - m, y: b.y - m, w: b.width + 2*m, h: b.height + 2*m }; })();
const fmt = o => [o.x, o.y, o.w, o.h].map(v => Math.round(v*10)/10).join(' ');
const FULL = fmt(BOX);
const FOCUS_RAW = '238 363.5 620 354.3'.split(' ').map(Number);
const wrap = document.getElementById('wrap');
const status = document.getElementById('status');
const DEFAULT = '&nbsp;';
status.innerHTML = DEFAULT;
let locked = null;

function netsOf(el){
  if (!el) return null;
  if (el.dataset.net) return [el.dataset.net];
  if (el.dataset.nets) return el.dataset.nets.split(' ');
  return null;
}
function show(nets){
  if (!nets){
    svg.classList.remove('focus');
    svg.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    status.innerHTML = DEFAULT;
    return;
  }
  svg.classList.add('focus');
  const set = new Set(nets);
  svg.querySelectorAll('[data-net],[data-nets]').forEach(e => {
    const n = netsOf(e);
    e.classList.toggle('hl', n.some(x => set.has(x)));
  });
  status.innerHTML = nets.map(n => NAMES[n]).filter(Boolean).join('  ·  ');
}
function target(e){ return e.target.closest('[data-net],[data-nets]'); }
svg.addEventListener('pointerover', e => { if (locked) return; show(netsOf(target(e))); });
svg.addEventListener('pointerleave', () => { if (!locked) show(null); });
svg.addEventListener('click', e => {
  const t = target(e);
  if (!t){ locked = null; show(null); return; }
  const n = netsOf(t);
  locked = (locked && locked.join() === n.join()) ? null : n;
  show(locked || n);
});

// vista y zoom: siempre la placa completa; "Acercar a lo nuevo" hace zoom a la parte que se arma
let z = 1;
svg.setAttribute('viewBox', FULL);
const VB = FULL.split(' ').map(Number);
function applyZoom(){ svg.style.width = (z * VB[2]) + 'px'; svg.style.height = (z * VB[3]) + 'px'; }
function fit(){ z = Math.max(0.25, Math.min(3, Math.min((wrap.clientWidth - 6) / VB[2], (wrap.clientHeight - 6) / VB[3]))); applyZoom(); wrap.scrollTo(0, 0); }
function zoomAt(f){ const cx = (wrap.scrollLeft + wrap.clientWidth / 2) / z, cy = (wrap.scrollTop + wrap.clientHeight / 2) / z; z = Math.max(0.2, Math.min(4, z * f)); applyZoom(); wrap.scrollTo(cx * z - wrap.clientWidth / 2, cy * z - wrap.clientHeight / 2); }
document.getElementById('zin').onclick = () => zoomAt(1.2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.2);
document.getElementById('zfit').onclick = fit;
if (HAS_FOCUS){
  const zall = document.getElementById('zall');
  zall.style.display = '';
  zall.onclick = () => {
    const [fx, fy, fw, fh] = FOCUS_RAW;
    z = Math.max(0.25, Math.min(4, Math.min((wrap.clientWidth - 6) / fw, (wrap.clientHeight - 6) / fh))); applyZoom();
    wrap.scrollTo((fx + fw / 2 - VB[0]) * z - wrap.clientWidth / 2, (fy + fh / 2 - VB[1]) * z - wrap.clientHeight / 2);
  };
}
fit();
window.addEventListener('resize', fit);
</script>
