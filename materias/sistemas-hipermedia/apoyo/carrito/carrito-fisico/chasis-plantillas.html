<body><div class="p"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, sans-serif">
<rect width="210" height="297" fill="#fff"/>
<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">1. BASE</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Cortar el contorno negro y las ranuras (4 + 6). Las muescas de los lados son para las ruedas. Cartón de 3.5 mm.</text>

7" fill="#d4781b" text-anchor="middle">MOTOR DER.</text><text x="94.75" y="94" font-size="2.4" fill="#d4781b" text-anchor="middle">(velcro)</text><text x="94.75" y="142" font-size="2.2" fill="#d4781b" text-anchor="middle">motorcito hacia atrás</text><text x="57" y="98" font-size="2.4" fill="#d4781b" text-anchor="middle">eje de las ruedas</text><line x1="-3" y1="62.5" x2="3" y2="62.5" stroke="#aaa" stroke-width="0.4"/><line x1="-3" y1="127.5" x2="3" y2="127.5" stroke="#aaa" stroke-width="0.4"/><line x1="111" y1="62.5" x2="117" y2="62.5" stroke="#aaa" stroke-width="0.4"/><line x1="111" y1="127.5" x2="117" y2="127.5" stroke="#aaa" stroke-width="0.4"/><text x="57" y="103" font-size="2.3" fill="#888" text-anchor="middle">las ruedas quedan afuera, en las muescas</text><g transform="translate(17,9) rotate(-20)"><rect x="-12" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/><rect x="4" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/></g><text x="17" y="18" font-size="2.4" fill="#222" text-anchor="middle">base del sensor</text><g transform="translate(97,9) rotate(20)"><rect x="-12" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/><rect x="4" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/></g><text x="97" y="18" font-size="2.4" fill="#222" text-anchor="middle">base del sensor</text><text x="0" y="158" font-size="2.6" fill="#555">Línea negra continua = cortar. Línea de color discontinua = dónde va cada pieza (no se corta).</text></g>

</svg></div><div class="p"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, sans-serif">

<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">2A. CUBIERTA para la PROTOBOARD (prototipo)</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Doble capa recomendada (pegar 2 cartones) para que no se doble. Cortar contorno y ranuras. La protoboard va con velcro.</text>
<g transform="translate(10,22)"><rect x="0" y="0" width="114" height="178" rx="2" fill="none" stroke="#000" stroke-width="0.5"/><path d="M0,0 H114 V178 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="42" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="90" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="138" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="42" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="90" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="138" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="29.5" y="6" width="55" height="165" fill="none" stroke="#2b7bb9" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="57" y="88.5" font-size="3.4" fill="#2b7bb9" text-anchor="middle">PROTOBOARD</text><text x="57" y="92.5" font-size="2.6" fill="#2b7bb9" text-anchor="middle">165 × 55 mm (velcro)</text><rect x="8" y="12" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="8" y="100" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="98" y="12" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="98" y="100" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="5" y="56" font-size="2.2" fill="#222" text-anchor="middle" transform="rotate(-90 5 56)">ventana de cables</text><rect x="89" y="150" width="15" height="10" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><text x="96.5" y="165" font-size="2.4" fill="#222" text-anchor="middle">interruptor</text><text x="57" y="3.2" font-size="3" fill="#888" text-anchor="middle">FRENTE</text><text x="0" y="185" font-size="2.5" fill="#555">Esta cubierta sobresale 28 mm por delante de la base y 0 mm por detrás. Las pestañas de las paredes entran en las 6 ranuras.</text></g>
<g transform="translate(10,288)"><line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="0.4"/><line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#000" stroke-width="0.4"/><line x1="100" y1="-1.5" x2="100" y2="1.5" stroke="#000" stroke-width="0.4"/><text x="104" y="1" font-size="2.6" fill="#333">Esta línea debe medir 100 mm exactos. Imprimir al 100 % (sin "ajustar a la página").</text></g>
</svg></div><div class="p"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, sans-serif">
<rect width="210" height="297" fill="#fff"/>
<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">2B. CUBIERTA para la PCB (versión final)</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Los 4 agujeros de 3,4 mm son para tornillos M3 con tuerca. Los sensores IR de la PCB quedan justo en el borde del frente.</text>

0" stroke-width="0.5"/><text x="87.5" y="124" font-size="2.4" fill="#222" text-anchor="middle">interruptor</text><text x="57" y="1.2" font-size="2.4" fill="#888" text-anchor="middle">FRENTE</text></g>

<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">3. PAREDES (cortar 2) y SOPORTES</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Las pestañas de arriba y abajo entran en las ranuras de la base y de la cubierta. No se pega nada.</text>
<g transform="translate(10,22)"><g transform="translate(0,0)"><path d="M0,3.5 H8 V0 H24 V3.5 H56 V0 H72 V3.5 H104 V0 H120 V3.5 H132 V51.5 H120 V55 H104 V51.5 H72 V55 H56 V51.5 H24 V55 H8 V51.5 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><rect x="20" y="13.5" width="38" height="28" rx="4" fill="none" stroke="#000" stroke-width="0.5"/><rect x="74" y="13.5" width="38" height="28" rx="4" fill="none" stroke="#000" stroke-width="0.5"/><text x="66" y="28.5" font-size="3" fill="#999" text-anchor="middle">PARED</text><text x="2" y="59" font-size="2.4" fill="#888">frente ←</text></g><g transform="translate(0,63)"><path d="M0,3.5 H8 V0 H24 V3.5 H56 V0 H72 V3.5 H104 V0 H120 V3.5 H132 V51.5 H120 V55 H104 V51.5 H72 V55 H56 V51.5 H24 V55 H8 V51.5 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><rect x="20" y="13.5" width="38" height="28" rx="4" fill="none" stroke="#000" stroke-width="0.5"/><rect x="74" y="13.5" width="38" height="28" rx="4" fill="none" stroke="#000" stroke-width="0.5"/><text x="66" y="28.5" font-size="3" fill="#999" text-anchor="middle">PARED</text><text x="2" y="59" font-size="2.4" fill="#888">frente ←</text></g><text x="0" y="134" font-size="2.8" fill="#555">ANILLOS de la rueda loca: cortar 4 normales + 1 con hueco chico (el de abajo)</text><circle cx="20" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="20" cy="162" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="20" y="184" font-size="2.3" fill="#222" text-anchor="middle">anillo (hueco 25)</text><circle cx="58" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="58" cy="162" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="58" y="184" font-size="2.3" fill="#222" text-anchor="middle">anillo (hueco 25)</text><circle cx="96" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="96" cy="162" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="96" y="184" font-size="2.3" fill="#222" text-anchor="middle">anillo (hueco 25)</text><circle cx="134" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="134" cy="162" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="134" y="184" font-size="2.3" fill="#222" text-anchor="middle">anillo (hueco 25)</text><circle cx="172" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="172" cy="162" r="11" fill="none" stroke="#000" stroke-width="0.5"/><text x="172" y="184" font-size="2.3" fill="#222" text-anchor="middle">último (hueco 22)</text><text x="0" y="192" font-size="2.4" fill="#555">Se apilan DEBAJO de la base, alineados con el hueco de la rueda loca. El anillo de hueco chico va de último. Añadir o quitar anillos hasta que el carro quede nivelado.</text><text x="0" y="204" font-size="2.8" fill="#555">TACOS para la PCB: cortar 8 (se apilan de a 2 en cada tornillo, entre la PCB y la cubierta)</text><rect x="0" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="7" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="22" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="29" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="44" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="51" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="66" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="73" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="0" y="225" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="7" cy="231" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="22" y="225" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="29" cy="231" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="44" y="225" width="14" height= <g transform="translate(10,288)"><line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="0.4"/><line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#000" stroke-width="0.4"/><line x1="100" y1="-1.5" x2="100" y2="1.5" stroke="#000" stroke-width="0.4"/><text x="104" y="1" font-size="2.6" fill="#333">Esta línea debe medir 100 mm exactos. Imprimir al 100 % (sin "ajustar a la página").</text></g>

<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">4. SENSORES para la protoboard</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Cada sensor lleva un emisor IR y un receptor IR separados por una tarjeta negra (la barrera). Cortar 2 soportes + 2 tarjetas.</text>
<g transform="translate(10,22)"><g transform="translate(0,0)"><path d="M0,0 H32 V26 H28 V29.5 H20 V26 H12 V29.5 H4 V26 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="9.5" cy="12" r="2.7" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="22.5" cy="12" r="2.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="15.2" y="4" width="1.6" height="17" fill="none" stroke="#000" stroke-width="0.5"/><text x="9.5" y="20.5" font-size="2.2" fill="#222" text-anchor="middle">emisor</text><text x="22.5" y="20.5" font-size="2.2" fill="#222" text-anchor="middle">receptor</text></g><g transform="translate(50,0)"><path d="M0,0 H32 V26 H28 V29.5 H20 V26 H12 V29.5 H4 V26 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="9.5" cy="12" r="2.7" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="22.5" cy="12" r="2.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="15.2" y="4" width="1.6" height="17" fill="none" stroke="#000" stroke-width="0.5"/><text x="9.5" y="20.5" font-size="2.2" fill="#222" text-anchor="middle">emisor</text><text x="22.5" y="20.5" font-size="2.2" fill="#222" text-anchor="middle">receptor</text></g><text x="0" y="40" font-size="2.4" fill="#555">Soportes: la lengüeta de abajo entra en la ranura inclinada de la base. El LED emisor (transparente/azul) a la izquierda y el receptor (negro) a la derecha, en AMBOS soportes.</text><text x="0" y="46" font-size="2.4" fill="#555">Tarjetas barrera (cartulina NEGRA gruesa o cartón forrado en cinta negra): cortar 2 de 14 × 22 mm y meterlas en la ranura del centro.</text><rect x="0" y="52" width="14" height="22" fill="none" stroke="#000" stroke-width="0.5"/><rect x="24" y="52" width="14" height="22" fill="none" stroke="#000" stroke-width="0.5"/></g>
