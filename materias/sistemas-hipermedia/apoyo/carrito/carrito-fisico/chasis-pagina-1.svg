<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, sans-serif">
<rect width="210" height="297" fill="#fff"/>
<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">1. BASE</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Cortar el contorno negro y las ranuras (4 + 6). Las muescas de los lados son para las ruedas. Cartón de 3.5 mm.</text>
<g transform="translate(10,22)"><path d="M0,0 H114 V56 H106 V134 H114 V150 H0 V134 H8 V56 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><text x="57" y="-2" font-size="3" fill="#888" text-anchor="middle">FRENTE</text><rect x="32.5" y="14" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="62" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="110" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="14" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="62" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="110" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="57" cy="16" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="57" y="33" font-size="2.8" fill="#222" text-anchor="middle">Rueda loca (hueco)</text><rect x="39" y="34" width="36" height="62" fill="none" stroke="#2b7bb9" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="57" y="65" font-size="3" fill="#2b7bb9" text-anchor="middle">PORTAPILAS 4×AA</text><text x="57" y="69" font-size="2.6" fill="#2b7bb9" text-anchor="middle">(velcro)</text><rect x="8" y="76" width="22.5" height="70" fill="none" stroke="#d4781b" stroke-width="0.5" stroke-dasharray="2 1.2"/><line x1="5" y1="95" x2="33.5" y2="95" stroke="#d4781b" stroke-width="0.4" stroke-dasharray="1 1"/><text x="19.25" y="90" font-size="2.7" fill="#d4781b" text-anchor="middle">MOTOR IZQ.</text><text x="19.25" y="94" font-size="2.4" fill="#d4781b" text-anchor="middle">(velcro)</text><text x="19.25" y="142" font-size="2.2" fill="#d4781b" text-anchor="middle">motorcito hacia atrás</text><rect x="83.5" y="76" width="22.5" height="70" fill="none" stroke="#d4781b" stroke-width="0.5" stroke-dasharray="2 1.2"/><line x1="80.5" y1="95" x2="109" y2="95" stroke="#d4781b" stroke-width="0.4" stroke-dasharray="1 1"/><text x="94.75" y="90" font-size="2.7" fill="#d4781b" text-anchor="middle">MOTOR DER.</text><text x="94.75" y="94" font-size="2.4" fill="#d4781b" text-anchor="middle">(velcro)</text><text x="94.75" y="142" font-size="2.2" fill="#d4781b" text-anchor="middle">motorcito hacia atrás</text><text x="57" y="98" font-size="2.4" fill="#d4781b" text-anchor="middle">eje de las ruedas</text><line x1="-3" y1="62.5" x2="3" y2="62.5" stroke="#aaa" stroke-width="0.4"/><line x1="-3" y1="127.5" x2="3" y2="127.5" stroke="#aaa" stroke-width="0.4"/><line x1="111" y1="62.5" x2="117" y2="62.5" stroke="#aaa" stroke-width="0.4"/><line x1="111" y1="127.5" x2="117" y2="127.5" stroke="#aaa" stroke-width="0.4"/><text x="57" y="103" font-size="2.3" fill="#888" text-anchor="middle">las ruedas quedan afuera, en las muescas</text><g transform="translate(17,9) rotate(-20)"><rect x="-12" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/><rect x="4" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/></g><text x="17" y="18" font-size="2.4" fill="#222" text-anchor="middle">base del sensor</text><g transform="translate(97,9) rotate(20)"><rect x="-12" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/><rect x="4" y="-1.75" width="8" height="3.5" fill="none" stroke="#000" stroke-width="0.5"/></g><text x="97" y="18" font-size="2.4" fill="#222" text-anchor="middle">base del sensor</text><text x="0" y="158" font-size="2.6" fill="#555">Línea negra continua = cortar. Línea de color discontinua = dónde va cada pieza (no se corta).</text></g>
<g transform="translate(10,288)"><line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="0.4"/><line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#000" stroke-width="0.4"/><line x1="100" y1="-1.5" x2="100" y2="1.5" stroke="#000" stroke-width="0.4"/><text x="104" y="1" font-size="2.6" fill="#333">Esta línea debe medir 100 mm exactos. Imprimir al 100 % (sin "ajustar a la página").</text></g>
</svg>