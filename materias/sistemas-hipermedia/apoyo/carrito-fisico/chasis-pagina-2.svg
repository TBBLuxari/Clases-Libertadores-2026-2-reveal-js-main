<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, sans-serif">
<rect width="210" height="297" fill="#fff"/>
<text x="10" y="10" font-size="5" font-weight="bold" fill="#111">2A. CUBIERTA para la PROTOBOARD (prototipo)</text>
<text x="10" y="15.5" font-size="2.8" fill="#555">Doble capa recomendada (pegar 2 cartones) para que no se doble. Cortar contorno y ranuras. La protoboard va con velcro.</text>
<g transform="translate(10,22)"><rect x="0" y="0" width="114" height="178" rx="2" fill="none" stroke="#000" stroke-width="0.5"/><path d="M0,0 H114 V178 H0 Z" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="42" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="90" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="32.5" y="138" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="42" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="90" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="78" y="138" width="3.5" height="16" fill="none" stroke="#000" stroke-width="0.5"/><rect x="29.5" y="6" width="55" height="165" fill="none" stroke="#2b7bb9" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="57" y="88.5" font-size="3.4" fill="#2b7bb9" text-anchor="middle">PROTOBOARD</text><text x="57" y="92.5" font-size="2.6" fill="#2b7bb9" text-anchor="middle">165 × 55 mm (velcro)</text><rect x="8" y="12" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="8" y="100" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="98" y="12" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><rect x="98" y="100" width="8" height="40" rx="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="5" y="56" font-size="2.2" fill="#222" text-anchor="middle" transform="rotate(-90 5 56)">ventana de cables</text><rect x="89" y="150" width="15" height="10" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><text x="96.5" y="165" font-size="2.4" fill="#222" text-anchor="middle">interruptor</text><text x="57" y="3.2" font-size="3" fill="#888" text-anchor="middle">FRENTE</text><text x="0" y="185" font-size="2.5" fill="#555">Esta cubierta sobresale 28 mm por delante de la base y 0 mm por detrás. Las pestañas de las paredes entran en las 6 ranuras.</text></g>
<g transform="translate(10,288)"><line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="0.4"/><line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#000" stroke-width="0.4"/><line x1="100" y1="-1.5" x2="100" y2="1.5" stroke="#000" stroke-width="0.4"/><text x="104" y="1" font-size="2.6" fill="#333">Esta línea debe medir 100 mm exactos. Imprimir al 100 % (sin "ajustar a la página").</text></g>
</svg>