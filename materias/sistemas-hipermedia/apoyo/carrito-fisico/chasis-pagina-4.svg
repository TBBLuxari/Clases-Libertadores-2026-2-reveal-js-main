"middle">anillo (hueco 25)</text><circle cx="134" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="134" cy="162" r="12.5" fill="none" stroke="#000" stroke-width="0.5"/><text x="134" y="184" font-size="2.3" fill="#222" text-anchor="middle">anillo (hueco 25)</text><circle cx="172" cy="162" r="17" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="172" cy="162" r="11" fill="none" stroke="#000" stroke-width="0.5"/><text x="172" y="184" font-size="2.3" fill="#222" text-anchor="middle">último (hueco 22)</text><text x="0" y="192" font-size="2.4" fill="#555">Se apilan DEBAJO de la base, alineados con el hueco de la rueda loca. El anillo de hueco chico va de último. Añadir o quitar anillos hasta que el carro quede nivelado.</text><text x="0" y="204" font-size="2.8" fill="#555">TACOS para la PCB: cortar 8 (se apilan de a 2 en cada tornillo, entre la PCB y la cubierta)</text><rect x="0" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="7" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="22" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="29" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="44" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="51" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="66" y="209" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="73" cy="215" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="0" y="225" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="7" cy="231" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="22" y="225" width="14" height="12" rx="1" fill="none" stroke="#000" stroke-width="0.5"/><circle cx="29" cy="231" r="1.7" fill="none" stroke="#000" stroke-width="0.5"/><rect x="44" y="225" width="14" height=