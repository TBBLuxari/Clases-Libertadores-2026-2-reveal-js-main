  <line x1="1273" y1="410" x2="1277" y2="410" stroke="#222" stroke-width="3"/>
  <line x1="1260" y1="430" x2="1280" y2="430" stroke="#222" stroke-width="2.5"/>
  <line x1="1260" y1="470" x2="1275" y2="470" stroke="#222" stroke-width="2.5"/>
