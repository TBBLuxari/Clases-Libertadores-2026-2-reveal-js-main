  <line x1="1269" y1="485" x2="1281" y2="485" stroke="#222" stroke-width="3"/>
  <line x1="1273" y1="490" x2="1277" y2="490" stroke="#222" stroke-width="3"/>
  <line x1="1260" y1="510" x2="1275" y2="510" stroke="#222" stroke-width="2.5"/>
