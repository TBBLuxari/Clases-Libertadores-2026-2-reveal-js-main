  <line x1="1273" y1="530" x2="1277" y2="530" stroke="#222" stroke-width="3"/>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <polyline points="950,260 950,470 1100,470"/>
  </g>

  <!-- Motores -->

  <g stroke="#222" stroke-width="2.5" fill="none">
    <polyline points="1100,310 1020,310 1020,344"/>
    <polyline points="1100,430 1020,430 1020,396"/>
    <circle cx="1020" cy="370" r="26" fill="#fff"/>
  </g>
  <text x="1020" y="376" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">M1</text>
  <text x="1420" y="612" text-anchor="end" font-size="13" fill="#555">Banderita azul = al riel de +5 a 6 V · Símbolo de tierra = GND</text>

  <!-- Notas -->
  <rect x="520" y="92" width="255" height="145" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="532" y="112" font-size="13" font-weight="bold" fill="#222">Notas</text>
  <g font-size="11.5" fill="#333">
    <text x="532" y="131">Rojo +9 V · Azul +5 a 6 V · Negro GND</text>
    <text x="532" y="148">Pata larga del LED = ánodo (+)</text>
    <text x="532" y="165">R3 1 kΩ: ↑ si no responde, ↓ si no apaga</text>
    <text x="532" y="182">LED y R4 al riel azul (no al de 9 V)</text>
    <text x="532" y="199">El motor va entre 1Y y 2Y</text>
    <text x="532" y="216">Sin mano el motor para; con mano gira</text>
    <text x="532" y="233">Los GND de las dos fuentes, unidos</text>
  </g>
  <text x="730" y="645" text-anchor="middle" font-size="15" fill="#444">Lo nuevo (zona amarilla): el motor 1, conectado entre las salidas 1Y (pin 3) y 2Y (pin 6).</text>
</svg>
