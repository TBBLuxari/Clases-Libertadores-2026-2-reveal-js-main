<title>Ruleta de Clase</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --bg: #14101f;
  --panel: #1d1631;
  --panel-2: #271e42;
  --line: #3a2d5c;
  --text: #efe9ff;
  --text-dim: #a99bd1;
  --pink: #ff5fc4;
  --teal: #5ff0d0;
  --amber: #ffcf5c;
  --pink-dim: #3a1f36;
  --teal-dim: #1b3a35;
}

*{ box-sizing: border-box; }

[hidden]{ display: none !important; }

body{
  background: var(--bg);
  color: var(--text);
  font-family: "VT323", monospace;
  min-height: 100vh;
}

body::before{
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.025) 0px,
    rgba(255,255,255,0.025) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 50;
}

.layout{
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

header{
  text-align: center;
  margin-bottom: 28px;
}

[contenteditable="true"]{
  outline: none;
  cursor: text;
  border-radius: 6px;
  padding: 2px 6px;
}
[contenteditable="true"]:hover{ box-shadow: 0 0 0 2px var(--line); }
[contenteditable="true"]:focus{ box-shadow: 0 0 0 2px var(--amber); }

.eyebrow{
  font-family: "Press Start 2P", monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--teal);
  margin-bottom: 10px;
}

h1{
  font-family: "Press Start 2P", monospace;
  font-size: clamp(20px, 4.2vw, 34px);
  color: var(--pink);
  text-shadow: 0 0 14px rgba(255,95,196,0.45);
  margin: 0 0 10px;
  line-height: 1.5;
  text-wrap: balance;
}

.subtitle{
  font-size: 22px;
  color: var(--text-dim);
  max-width: 60ch;
  margin: 0 auto;
}

.wheels{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-bottom: 24px;
}

@media (max-width: 720px){
  .wheels{ grid-template-columns: 1fr; }
}

.card{
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.card h2{
  font-family: "Press Start 2P", monospace;
  font-size: 13px;
  margin: 0;
  letter-spacing: 0.04em;
}

.card.estudiantes h2{ color: var(--pink); }
.card.preguntas h2{ color: var(--teal); }

.wheel-holder{
  position: relative;
  width: 320px;
  height: 320px;
  max-width: 100%;
}

.pointer{
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 22px solid var(--amber);
  filter: drop-shadow(0 0 6px rgba(255,207,92,0.7));
  z-index: 5;
}

canvas{
  border-radius: 50%;
  display: block;
  width: 100%;
  height: 100%;
}

.remaining{
  font-size: 18px;
  color: var(--text-dim);
}

.remaining b{ color: var(--text); }

.card-buttons{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

button{
  font-family: "VT323", monospace;
  font-size: 19px;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 8px 16px;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.12s ease;
}

button:hover:not(:disabled){ border-color: var(--text-dim); transform: translateY(-1px); }
button:active:not(:disabled){ transform: translateY(0); }
button:disabled{ opacity: 0.4; cursor: not-allowed; }
button:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

.spin-pink{ border-color: var(--pink); color: var(--pink); }
.spin-teal{ border-color: var(--teal); color: var(--teal); }

.editar summary{
  cursor: pointer;
  color: var(--text-dim);
  font-size: 17px;
}

.editar{ width: 100%; }

textarea{
  width: 100%;
  min-height: 110px;
  margin-top: 8px;
  background: var(--bg);
  color: var(--text);
  border: 2px solid var(--line);
  border-radius: 8px;
  font-family: "VT323", monospace;
  font-size: 16px;
  padding: 8px 10px;
  resize: vertical;
}

.turno{
  background: var(--panel);
  border: 2px solid var(--amber);
  border-radius: 14px;
  padding: 22px;
  text-align: center;
  margin-bottom: 24px;
  box-shadow: 0 0 24px rgba(255,207,92,0.08);
  transition: padding 0.2s ease;
}

.turno.expandido{
  padding: 48px 30px;
}

.turno.expandido .turno-nombre{
  font-size: 40px;
}

.turno.expandido .turno-pregunta.revelada{
  font-size: 32px;
  padding: 24px 30px;
}

.turno.expandido .numero-chip{
  font-size: 12px;
}

.ver-ruletas{
  color: var(--text-dim);
}

@media (prefers-reduced-motion: reduce){
  .turno{ transition: none; }
}

.turno .label{
  font-family: "Press Start 2P", monospace;
  font-size: 11px;
  color: var(--amber);
  margin-bottom: 14px;
  letter-spacing: 0.06em;
}

.turno-nombre{
  font-size: 30px;
  color: var(--pink);
  margin-bottom: 6px;
}

.turno-pregunta{
  font-size: 22px;
  color: var(--text);
  max-width: 65ch;
  margin: 0 auto 16px;
  min-height: 1.4em;
}

.turno-vacio{
  font-size: 20px;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.turno-pendiente{
  font-size: 22px;
  margin-bottom: 12px;
}
.turno-pendiente b{ color: var(--teal); }

.revelar{
  border-color: var(--amber);
  color: var(--amber);
  font-size: 18px;
  margin-bottom: 10px;
}

.turno-pregunta.revelada{
  border: 2px solid var(--teal);
  border-radius: 10px;
  padding: 16px 20px;
  background: var(--panel-2);
}

.cronometro{
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.crono-etiqueta{
  font-size: 18px;
  color: var(--text-dim);
}

.crono-tiempo{
  font-family: "Press Start 2P", monospace;
  font-size: 40px;
  color: var(--teal);
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

.crono-tiempo.crono-alerta{
  color: var(--pink);
  text-shadow: 0 0 14px rgba(255,95,196,0.5);
}

.crono-start{ border-color: var(--teal); color: var(--teal); }
.crono-reset{ color: var(--text-dim); }

.turno.expandido .crono-tiempo{ font-size: 56px; }

.numero-chip{
  display: block;
  font-family: "Press Start 2P", monospace;
  font-size: 10px;
  color: var(--teal);
  margin-bottom: 10px;
  letter-spacing: 0.05em;
}

.controles-turno{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  align-items: center;
}

.gran-cta{
  font-family: "Press Start 2P", monospace;
  font-size: 13px;
  padding: 14px 22px;
  background: var(--pink);
  color: #1a0f18;
  border-color: var(--pink);
}
.gran-cta:hover:not(:disabled){ background: #ff7ed0; }

.registrar{
  border-color: var(--teal);
  color: var(--teal);
  font-size: 22px;
  padding: 10px 20px;
}

.fallo{
  border-color: var(--pink);
  color: var(--pink);
  font-size: 22px;
  padding: 10px 20px;
}

.panel-profe{
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 60;
  max-width: min(420px, 90vw);
  background: var(--panel-2);
  border: 2px solid var(--amber);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 17px;
  line-height: 1.35;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.panel-profe b{ color: var(--amber); }
.panel-profe .pp-linea{ margin-bottom: 6px; }

/* rúbrica: puntos de control de la pregunta, para calificar al terminar el intento */
.panel-rubrica{
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 70;
  width: min(560px, 92vw);
  max-height: 80vh;
  overflow-y: auto;
  background: var(--panel-2);
  border: 2px solid var(--teal);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: 0 0 28px rgba(0,0,0,0.6);
}
.panel-rubrica[hidden]{ display: none; }
.panel-rubrica .pr-titulo{
  font-family: "Press Start 2P", monospace;
  font-size: 10px;
  color: var(--teal);
  margin-bottom: 12px;
  letter-spacing: 0.05em;
}
.panel-rubrica label.pr-criterio{
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 8px 6px;
  font-size: 20px;
  line-height: 1.3;
  cursor: pointer;
  border-radius: 8px;
}
.panel-rubrica label.pr-criterio:hover{ background: rgba(255,255,255,0.05); }
.panel-rubrica label.pr-criterio input{ width: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--teal); }
.panel-rubrica .pr-num{ color: var(--amber); flex: none; }
.panel-rubrica .pr-pie{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}
.panel-rubrica .pr-total{
  font-family: "Press Start 2P", monospace;
  font-size: 18px;
  color: var(--amber);
}

.descartar{
  color: var(--text-dim);
}

.opciones{
  display: flex;
  justify-content: center;
  gap: 8px;
  align-items: center;
  font-size: 16px;
  color: var(--text-dim);
  margin-top: 14px;
}

.bitacora{
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}

.bitacora-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}

.bitacora-header h2{
  font-family: "Press Start 2P", monospace;
  font-size: 13px;
  color: var(--text);
  margin: 0;
}

.tabla-wrap{
  overflow-x: auto;
}

table{
  width: 100%;
  border-collapse: collapse;
  font-size: 18px;
}

th, td{
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

td.pregunta-col{
  white-space: normal;
  min-width: 220px;
}

th{
  color: var(--text-dim);
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

td.nota{
  font-variant-numeric: tabular-nums;
  color: var(--amber);
  font-size: 20px;
}

.vacio-fila td{
  color: var(--text-dim);
  text-align: center;
  padding: 18px;
}

.aside-preguntas{
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(320px, 88vw);
  background: var(--panel);
  border-left: 2px solid var(--line);
  padding: 20px 18px;
  overflow-y: auto;
  box-shadow: -10px 0 28px rgba(0,0,0,0.35);
  transform: translateX(100%);
  transition: transform 0.25s ease;
  z-index: 40;
}

.aside-preguntas.abierto{
  transform: translateX(0);
}

.aside-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.aside-preguntas h2{
  font-family: "Press Start 2P", monospace;
  font-size: 12px;
  color: var(--teal);
  margin: 0;
  letter-spacing: 0.04em;
}

.aside-cerrar{
  font-size: 16px;
  padding: 4px 10px;
  line-height: 1;
}

.aside-toggle{
  position: fixed;
  top: 130px;
  right: 0;
  z-index: 41;
  background: var(--panel-2);
  border: 2px solid var(--line);
  border-right: none;
  border-radius: 10px 0 0 10px;
  color: var(--teal);
  font-family: "VT323", monospace;
  font-size: 18px;
  padding: 10px 14px;
  cursor: pointer;
}

.sonido-toggle{
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 41;
  background: var(--panel-2);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 18px;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce){
  .aside-preguntas{ transition: none; }
}

.aside-vacio{
  color: var(--text-dim);
  font-size: 16px;
}

.aside-item{
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
}
.aside-item:last-child{ border-bottom: none; }

.aside-item summary{
  cursor: pointer;
  font-size: 18px;
  color: var(--text);
}
.aside-item[open] summary{ color: var(--teal); }

.aside-texto{
  font-size: 17px;
  color: var(--text-dim);
  margin: 8px 0;
  line-height: 1.3;
}

.aside-mostrar{
  font-size: 15px;
  padding: 5px 10px;
}

.aside-tiempo{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  color: var(--text-dim);
  margin: 6px 0 10px;
}

.aside-tiempo input{
  width: 56px;
  font-family: "VT323", monospace;
  font-size: 16px;
  text-align: center;
  background: var(--bg);
  color: var(--text);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 2px 4px;
}

.toast{
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel-2);
  border: 2px solid var(--teal);
  color: var(--teal);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 17px;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 100;
  pointer-events: none;
}

.toast.show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce){
  button{ transition: none; }
}
</style>

<div class="layout">
<div class="main">

  <header>
    <div class="eyebrow" id="campo-eyebrow" contenteditable="true" spellcheck="false"></div>
    <h1 id="campo-titulo" contenteditable="true" spellcheck="false"></h1>
    <p class="subtitle" id="campo-subtitulo" contenteditable="true" spellcheck="false"></p>
  </header>

  <div class="wheels">
    <div class="card estudiantes">
      <h2>ESTUDIANTES</h2>
      <div class="wheel-holder">
        <div class="pointer"></div>
        <canvas id="canvas-estudiantes" width="640" height="640"></canvas>
      </div>
      <div class="remaining" id="restantes-estudiantes">quedan <b>0</b></div>
      <div class="card-buttons">
        <button class="spin-pink" id="btn-girar-estudiante">🎯 Girar</button>
      </div>
      <details class="editar">
        <summary>editar lista de estudiantes</summary>
        <textarea id="lista-estudiantes" spellcheck="false"></textarea>
      </details>
    </div>

    <div class="card preguntas">
      <h2>PREGUNTAS</h2>
      <div class="wheel-holder">
        <div class="pointer"></div>
        <canvas id="canvas-preguntas" width="640" height="640"></canvas>
      </div>
      <div class="remaining" id="restantes-preguntas">quedan <b>0</b></div>
      <div class="card-buttons">
        <button class="spin-teal" id="btn-girar-pregunta">🎯 Girar</button>
      </div>
      <details class="editar">
        <summary>editar banco de preguntas</summary>
        <textarea id="lista-preguntas" spellcheck="false"></textarea>
      </details>
    </div>
  </div>

  <div class="turno">
    <div class="label">TURNO ACTUAL</div>
    <div id="turno-contenido">
      <div class="turno-vacio">Giren las ruletas, o elijan una pregunta desde el panel de la derecha.</div>
    </div>
    <div class="controles-turno">
      <button class="gran-cta" id="btn-pareja">🎡 SACAR PAREJA</button>
      <button class="ver-ruletas" id="btn-ver-ruletas" hidden>🎡 Ver ruletas</button>
      <button class="registrar" id="btn-logro" disabled>✅ Lo logró (5)</button>
      <button class="fallo" id="btn-fallo" disabled>❌ No lo logró (0)</button>
      <button class="descartar" id="btn-paso" disabled title="Nota 0; la pregunta no se gasta y puede volver a salir">⏭ No lo intentó</button>
      <button class="descartar" id="btn-descartar" disabled>↺ Descartar turno</button>
    </div>
    <div class="opciones">
      <label><input type="checkbox" id="no-repetir-preguntas" checked> no repetir preguntas ya usadas</label>
    </div>
  </div>

  <div class="bitacora">
    <div class="bitacora-header">
      <h2>BITÁCORA</h2>
      <div class="card-buttons">
        <button id="btn-copiar">📋 Copiar</button>
        <button id="btn-reiniciar">🔄 Reiniciar todo</button>
      </div>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Estudiante</th><th>Pregunta</th><th>Nota</th><th>Hora</th></tr>
        </thead>
        <tbody id="tabla-bitacora">
          <tr class="vacio-fila"><td colspan="5">Todavía no hay turnos registrados.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<aside class="aside-preguntas" id="aside-preguntas">
  <div class="aside-header">
    <h2>BANCO DE PREGUNTAS</h2>
    <button class="aside-cerrar" id="btn-cerrar-aside">✕</button>
  </div>
  <div id="aside-lista"></div>
</aside>

<button class="aside-toggle" id="btn-toggle-aside">❮ Preguntas</button>
<button class="sonido-toggle" id="btn-sonido" title="Silenciar / activar sonido">🔊</button>

</div>

<div class="toast" id="toast"></div>
<div class="panel-profe" id="panel-profe" hidden></div>
<div class="panel-rubrica" id="panel-rubrica" hidden></div>

<script>
(function(){

  var EJEMPLO_ESTUDIANTES = [
    "Ana (ejemplo)","Bryan (ejemplo)","Camila (ejemplo)","Diego (ejemplo)",
    "Estefanía (ejemplo)","Felipe (ejemplo)"
  ];

  var EJEMPLO_PREGUNTAS = [
    "Cree una escena nueva con un piso, un cubo y un muro hecho con otro cubo estirado. Cree un script nuevo y agregue un Rigidbody al cubo principal. Programe su movimiento con W, A, S y D usando el Rigidbody, sin que se voltee. Al empujar contra el muro, el cubo debe chocar con él y no atravesarlo. (tiempo estimado: 10 min) || Escena nueva con piso, cubo y muro || Rigidbody agregado, script nuevo asignado y compila || El cubo se mueve con W, A, S y D || No se voltea (freezeRotation) || Choca con el muro y no lo atraviesa",
    "Cree una escena nueva y un script nuevo. Agregue un cubo y asigne el script al cubo. Programe que, al presionar la barra espaciadora, aparezca en la Console el mensaje \"Salto\" una sola vez por cada pulsación, aunque la tecla se mantenga presionada. Presione Play y mantenga la barra espaciadora para comprobar el resultado. (tiempo estimado: 8 min) || Escena nueva con un cubo || Script nuevo asignado y compila || Aparece el mensaje al presionar Space || Sale una sola vez por pulsación aunque mantenga la tecla (GetKeyDown) ",
    "Cree una escena nueva con un piso y un cubo ubicado sobre él, y cree un script nuevo. Agregue un Rigidbody al cubo. Programe el movimiento del cubo con las teclas W, A, S y D usando el Rigidbody, de modo que no se voltee ni ruede. Permita editar la velocidad desde el Inspector y haga que el cubo se detenga al soltar las teclas. (tiempo estimado: 10 min) || Escena nueva con piso y cubo sobre el piso || Rigidbody agregado, script nuevo asignado y compila || Se mueve con W, A, S y D || No se voltea (freezeRotation) || Velocidad pública y se detiene al soltar las teclas",

  var COLORS_PINK = ["#3a1f36", "#502a4a"];
  var COLORS_TEAL = ["#1b3a35", "#204a44"];

  function cargar(clave, porDefecto){
    try{
      var raw = localStorage.getItem(clave);
      if (raw === null) return porDefecto;
      return JSON.parse(raw);
    }catch(e){ return porDefecto; }
  }
  function guardar(clave, valor){
    try{ localStorage.setItem(clave, JSON.stringify(valor)); }catch(e){}
  }

  // --- marcas ocultas: la cantidad de espacios AL FINAL de cada línea ---
  // Estudiantes: 0 = normal, 1 = aplicado, 2 o más = tramposo.
  // Preguntas:   0 = normal, 1 = fácil,    2 o más = difícil.
  // No se ven en pantalla; el texto mostrado siempre va sin esos espacios.
  var CAT_ESTUDIANTE = ["normal", "aplicado", "tramposo"];
  var NIVEL_PREGUNTA = ["normal", "facil", "dificil"];

  // Probabilidad (en %) de que a cada categoría le toque cada nivel.
  // Ninguno es 0 ni 100 para que parezca suerte.
  var PESOS = {
    aplicado: { facil: 60, normal: 35, dificil: 5 },
    normal:   { facil: 20, normal: 60, dificil: 20 },
    tramposo: { facil: 5,  normal: 20, dificil: 75 }
  };

  function parsearLineas(texto){
    return texto.split("\n").map(function(l){
      l = l.replace(/\r$/, "");
      var marca = Math.min(l.match(/[ \t ]*$/)[0].length, 2);
      return { texto: l.trim(), marca: marca };
    }).filter(function(x){ return x.texto.length > 0; });
  }

  function parsearLista(texto){
    return parsearLineas(texto).map(function(x){ return x.texto; });
  }

  // líneas tal cual (con sus espacios finales), sin las vacías: es lo que se guarda
  function lineasCrudas(texto){
    return texto.split("\n").map(function(l){ return l.replace(/\r$/, ""); })
      .filter(function(l){ return l.trim().length > 0; });
  }

  function truncar(txt, n){
    if (txt.length <= n) return txt;
    return txt.slice(0, n - 1).trim() + "…";
  }

  // --- sonido: generado con Web Audio, sin archivos externos ---
  var sonidoOn = cargar("ruleta_sonido", true);
  var audioCtx = null;

  function getAudioCtx(){
    if (!sonidoOn) return null;
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }

  function tono(freq, duracion, tipo, volumen, retraso){
    var ctx = getAudioCtx();
    if (!ctx) return;
    var inicio = ctx.currentTime + (retraso || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = tipo || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volumen || 0.07, inicio);
    gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(inicio);
    osc.stop(inicio + duracion + 0.02);
  }

  function sonidoTick(){ tono(700, 0.045, "square", 0.05); }

    tono(523.25, 0.12, "triangle", 0.09);
    tono(783.99, 0.20, "triangle", 0.09, 0.09);

  // --- tiempo asignado por pregunta: editable en el panel lateral, con un
  // valor sugerido leído del propio enunciado si dice "N min" ---
  var tiemposPreguntas = cargar("ruleta_tiempos", {});

  // --- rúbrica dentro de la pregunta ---
  // Una línea del banco puede traer puntos de control separados por "||":
  //   Enunciado (tiempo estimado: 8 min) || punto 1 || punto 2 || punto 3
  // Cada punto vale 1. Solo el enunciado se muestra; los puntos salen en el
  // panel de calificación (botón "Calificar" o Alt+R).
  function partesPregunta(texto){
    var p = texto.split("||").map(function(s){ return s.trim(); });
    return {
      enunciado: p[0],
      criterios: p.slice(1).filter(function(s){ return s.length > 0; })
    };
  }

  function minutosSugeridos(texto){
    var m = partesPregunta(texto).enunciado.match(/(\d+)\s*min/i);
    return m ? parseInt(m[1], 10) : 5;
  }
  function obtenerMinutos(texto){
    return (tiemposPreguntas[texto] !== undefined) ? tiemposPreguntas[texto] : minutosSugeridos(texto);
  }
  function guardarMinutos(texto, minutos){
    tiemposPreguntas[texto] = minutos;
    guardar("ruleta_tiempos", tiemposPreguntas);
  }
  function limpiarEnunciado(texto){
    return partesPregunta(texto).enunciado.replace(/\s*\(\s*tiempo estimado[^)]*\)\s*$/i, "").trim();
  }

  // --- cronómetro de la pregunta revelada ---
  // FIX: el cronómetro ya no cuenta "-1 por tick" (setInterval no garantiza
  // que cada disparo caiga exactamente cada 1000ms — si el navegador está
  // ocupado o la pestaña pierde foco, los disparos se retrasan y el reloj
  // se atrasa frente al tiempo real, acumulando el error). Ahora se calcula
  // el tiempo restante comparando contra un timestamp real (Date.now()), así
  // que no importa si algún tick llega tarde: el número mostrado siempre
  // refleja el tiempo real transcurrido.
  var cronometroIntervalo = null;

  function pararCronometro(){
    if (cronometroIntervalo){
      clearInterval(cronometroIntervalo);
      cronometroIntervalo = null;
    }
  }

  function formatoTiempo(segundos){
    var m = Math.floor(segundos / 60);
    var s = segundos % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function iniciarCronometro(minutos, elTiempo, btnStart, btnReset){
    pararCronometro();
    var totalSegundos = Math.max(1, Math.round(minutos * 60));
    var fin = Date.now() + totalSegundos * 1000;
    var ultimoMostrado = null;

    elTiempo.textContent = formatoTiempo(totalSegundos);
    elTiempo.classList.remove("crono-alerta");
    btnStart.hidden = true;
    btnReset.hidden = false;

    function tick(){
      var restantes = Math.ceil((fin - Date.now()) / 1000);

      if (restantes <= 0){
        elTiempo.textContent = "¡TIEMPO!";
        elTiempo.classList.add("crono-alerta");
        pararCronometro();
        sonidoAlarma();
        return;
      }

      if (restantes === ultimoMostrado) return;
      ultimoMostrado = restantes;

      elTiempo.textContent = formatoTiempo(restantes);
      if (restantes <= 10){
        elTiempo.classList.add("crono-alerta");
        sonidoTickFinal();
      }
    }

    tick();
    cronometroIntervalo = setInterval(tick, 250);
  }

  function crearRueda(cfg){
    var canvas = document.getElementById(cfg.canvasId);
    var ctx = canvas.getContext("2d");
    var estado = {
      items: [],
      rotation: 0,
      girando: false,
      resaltar: false, // solo hay casilla resaltada desde que se gira hasta que cambia la lista
      onLanded: cfg.onLanded
    };

    // casilla que está bajo la flecha (arriba) con la rotación actual
    function indiceBajoPuntero(){
      var n = estado.items.length;
      if (!n) return -1;
      var a = (Math.PI*2) / n;
      return Math.floor((((-estado.rotation) % (Math.PI*2) + Math.PI*2) % (Math.PI*2)) / a);
    }

    function dibujar(){
      var w = canvas.width, h = canvas.height;
      var k = w / 320; // el canvas tiene el doble de resolución que su tamaño en pantalla
      var cx = w/2, cy = h/2, r = w/2 - 4*k;
      ctx.clearRect(0,0,w,h);

      if (estado.items.length === 0){
        ctx.fillStyle = "#271e42";
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#a99bd1";
        ctx.font = (20*k) + "px VT323, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("agrega elementos", cx, cy);
        return;
      }

      var n = estado.items.length;
      var anglePerSeg = (Math.PI*2) / n;
      var activo = estado.resaltar ? indiceBajoPuntero() : -1;

      var fuente, tam, maxChars;
      if (cfg.numeros){
        fuente = '"Press Start 2P", monospace';
        tam = n <= 12 ? 16 : 13;
        maxChars = 3;
      } else {
        fuente = "VT323, monospace";
        tam = n <= 8 ? 21 : (n <= 12 ? 19 : (n <= 16 ? 17 : 15));
        maxChars = n > 12 ? 11 : 13;
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(estado.rotation);

      for (var i = 0; i < n; i++){
        var start = -Math.PI/2 + i*anglePerSeg;
        var end = start + anglePerSeg;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0, 0, r, start, end);
        ctx.closePath();
        ctx.fillStyle = (i === activo) ? cfg.colorActivo : cfg.colors[i % cfg.colors.length];
        ctx.fill();
        ctx.strokeStyle = "#14101f";
        ctx.lineWidth = 2*k;
        ctx.stroke();

        var mid = start + anglePerSeg/2;
        var absMid = ((mid + estado.rotation + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
        ctx.save();
        ctx.rotate(mid);
        ctx.translate(r*(cfg.textRadius || 0.62), 0);
        if (absMid > Math.PI/2 || absMid < -Math.PI/2){
          ctx.rotate(Math.PI);
        }
        ctx.font = (tam*k) + "px " + fuente;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        var texto = truncar(estado.items[i].label, maxChars);
        // contorno oscuro + relleno claro: se lee sobre cualquier color de casilla
        ctx.strokeStyle = "#0d0a16";
        ctx.lineWidth = 5*k;
        ctx.strokeText(texto, 0, 0);
        ctx.fillStyle = (i === activo) ? "#ffffff" : "#f3eeff";
        ctx.fillText(texto, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    function actualizarContador(){
      var el = document.getElementById(cfg.contadorId);
      el.innerHTML = "quedan <b>" + estado.items.length + "</b>";
    }

    function setItems(items){
      estado.items = items;
      estado.resaltar = false;
      dibujar();
      actualizarContador();
    }

    function girar(forzado){
      if (estado.girando || estado.items.length === 0) return;
      estado.girando = true;
      estado.resaltar = true;
      cfg.spinBtn.disabled = true;

      var n = estado.items.length;
      var idx;
      if (typeof forzado === "number") idx = forzado;
      else if (cfg.elegirIndice) idx = cfg.elegirIndice(estado.items);
      else idx = Math.floor(Math.random() * n);
      var anglePerSeg = (Math.PI*2) / n;
      var jitter = (Math.random() - 0.5) * anglePerSeg * 0.6;
      var targetMod = -idx*anglePerSeg - anglePerSeg/2 + jitter;
      var turns = 4 + Math.floor(Math.random() * 2); // vueltas ENTERAS: una fracción desalinea la rueda de la casilla que se anuncia
      var delta = ((targetMod - estado.rotation) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
      var targetRotation = estado.rotation + turns*Math.PI*2 + delta;
      var startRotation = estado.rotation;
      var duration = 4200;

      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion){
        estado.rotation = targetRotation;
        dibujar();
        terminar();
        return;
      }

      var tAnim = 0;      // tiempo de animación, no de reloj
      var ultimoTs = null;
      var ultimoIdxSonado = Math.floor((((-estado.rotation) % (Math.PI*2) + Math.PI*2) % (Math.PI*2)) / anglePerSeg);
      function easeOut(t){ return 1 - Math.pow(1 - t, 2.5); }

      function frame(ts){
        if (ultimoTs === null) ultimoTs = ts;
        // si el navegador se congela (p. ej. compartiendo pantalla), la rueda
        // espera en vez de saltar de golpe a la posición final
        tAnim += Math.min(ts - ultimoTs, 40);
        ultimoTs = ts;
        var p = Math.min(1, tAnim / duration);
        estado.rotation = startRotation + (targetRotation - startRotation) * easeOut(p);
        dibujar();

        var idxBajoPuntero = Math.floor((((-estado.rotation) % (Math.PI*2) + Math.PI*2) % (Math.PI*2)) / anglePerSeg);
        if (idxBajoPuntero !== ultimoIdxSonado){
          ultimoIdxSonado = idxBajoPuntero;
          sonidoTick();
        }

        if (p < 1){
          requestAnimationFrame(frame);
        } else {
          terminar();
        }
      }
      requestAnimationFrame(frame);

      function terminar(){
        estado.girando = false;
        cfg.spinBtn.disabled = false;
        sonidoLanding();
        estado.onLanded(estado.items[idx], idx);
      }
    }

    cfg.spinBtn.addEventListener("click", function(){ girar(); });

    return {
      setItems: setItems,
      dibujar: dibujar,
      girar: girar,
      getItems: function(){ return estado.items; },
      estaGirando: function(){ return estado.girando; }
    };
  }

  // elige el índice de la pregunta según la categoría del estudiante:
  // primero el nivel (con los PESOS), luego una pregunta al azar de ese nivel.
  // Si un nivel ya no tiene preguntas, se reparte entre los que sí tienen.
  function elegirIndicePregunta(items){
    var pesos = PESOS[categoriaActual || "normal"];
    var grupos = { facil: [], normal: [], dificil: [] };
    items.forEach(function(it, i){ grupos[it.nivel].push(i); });

    var disponibles = Object.keys(grupos).filter(function(n){ return grupos[n].length > 0; });
    var total = disponibles.reduce(function(s, n){ return s + pesos[n]; }, 0);
    var r = Math.random() * total;
    var elegido = disponibles[disponibles.length - 1];
    for (var k = 0; k < disponibles.length; k++){
      r -= pesos[disponibles[k]];
      if (r < 0){ elegido = disponibles[k]; break; }
    }
    var g = grupos[elegido];
    return g[Math.floor(Math.random() * g.length)];
  }

    var puedeRegistrar = !!(currentStudent && currentQuestion && currentQuestion.revelada);

      btn.textContent = "👁️ Mostrar en el centro";
      btn.addEventListener("click", function(){
        mostrarPreguntaEnCentro(i + 1, item.full);
      });
      det.appendChild(btn);

      cont.appendChild(det);
    });
  }

  // el estudiante se decide primero (al azar) para que la pregunta se sortee
  // según su categoría, y las dos ruedas giran a la vez como siempre
  document.getElementById("btn-pareja").addEventListener("click", function(){
    if (ruedaEstudiantes.estaGirando() || ruedaPreguntas.estaGirando()) return;
    var ests = ruedaEstudiantes.getItems();
    var idx = ests.length ? Math.floor(Math.random() * ests.length) : undefined;
    categoriaActual = ests.length ? ests[idx].cat : null;
    ruedaEstudiantes.girar(idx);
    ruedaPreguntas.girar();
  });

  document.getElementById("btn-descartar").addEventListener("click", function(){
    currentStudent = null;
    currentQuestion = null;
    categoriaActual = null;
    salirModoGrande();
    renderTurno();
  });

  // quita solo la primera línea que coincida, conservando las marcas de las demás
  function quitarDeTextarea(textarea, valor){
    var quitado = false;
    var items = lineasCrudas(textarea.value).filter(function(l){
      if (!quitado && l.trim() === valor){ quitado = true; return false; }
      return true;
    });
    textarea.value = items.join("\n");
  }

  function mostrarToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // conservarPregunta: el estudiante no lo intentó, la pregunta no se gasta
  function registrarTurno(nota, conservarPregunta){
    var noRepetir = document.getElementById("no-repetir-preguntas").checked && !conservarPregunta;

    var bitacora = cargar("ruleta_bitacora", []);
    bitacora.push({
      estudiante: currentStudent,
      pregunta: limpiarEnunciado(currentQuestion.full),
      nota: nota,
      hora: new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })
    });
    guardar("ruleta_bitacora", bitacora);
    renderBitacora();

    quitarDeTextarea(textareaEstudiantes, currentStudent);
    guardar("ruleta_estudiantes", lineasCrudas(textareaEstudiantes.value));
    if (noRepetir){
      quitarDeTextarea(textareaPreguntas, currentQuestion.full);
      guardar("ruleta_preguntas", lineasCrudas(textareaPreguntas.value));
    }
    refrescarRuedas();

    currentStudent = null;
    currentQuestion = null;
    categoriaActual = null;
    salirModoGrande();
    renderTurno();
    mostrarToast("Turno registrado en la bitácora");
  }

  btnLogro.addEventListener("click", function(){
    if (criteriosActuales().length > 0) mostrarPanelRubrica();
    else registrarTurno("5");
  });
  btnFallo.addEventListener("click", function(){ registrarTurno("0"); });
  btnPaso.addEventListener("click", function(){ registrarTurno("0 (no intentó)", true); });

  // --- panel de calificación: los puntos de control de la pregunta, que solo
  // se abren al terminar el intento (botón "Calificar" o Alt+R). Teclas 1-9
  // marcan cada punto y Enter guarda la nota. ---
  function ocultarPanelRubrica(){
    elPanelRubrica.hidden = true;
  }

  function totalRubrica(){
    var n = 0;
    elPanelRubrica.querySelectorAll("input[type=checkbox]").forEach(function(c){ if (c.checked) n++; });
    return n;
  }

  function mostrarPanelRubrica(){
    if (!currentQuestion || !currentQuestion.revelada){
      mostrarToast("Primero revelen la pregunta");
      return;
    }
    var criterios = criteriosActuales();
    if (criterios.length === 0){
      mostrarToast("Esta pregunta no tiene rúbrica");
      return;
    }
    if (!currentQuestion.marcas) currentQuestion.marcas = criterios.map(function(){ return false; });

    elPanelRubrica.innerHTML = "";

    var titulo = document.createElement("div");
    titulo.className = "pr-titulo";
    titulo.textContent = "PUNTOS DE CONTROL";
    elPanelRubrica.appendChild(titulo);

    var total = document.createElement("div");
    total.className = "pr-total";
    function refrescarTotal(){
      total.textContent = totalRubrica() + " de " + criterios.length;
    }

    criterios.forEach(function(texto, i){
      var fila = document.createElement("label");
      fila.className = "pr-criterio";
      var caja = document.createElement("input");
      caja.type = "checkbox";
      caja.checked = !!currentQuestion.marcas[i];
      caja.addEventListener("change", function(){
        currentQuestion.marcas[i] = caja.checked;
        refrescarTotal();
      });
      var num = document.createElement("span");
      num.className = "pr-num";
      num.textContent = (i + 1) + ".";
      var txt = document.createElement("span");
      txt.textContent = texto;
      fila.appendChild(caja);
      fila.appendChild(num);
      fila.appendChild(txt);
      elPanelRubrica.appendChild(fila);
    });

    var pie = document.createElement("div");
    pie.className = "pr-pie";
    pie.appendChild(total);

    var btnGuardar = document.createElement("button");
    btnGuardar.className = "registrar";
    btnGuardar.textContent = "✅ Guardar nota";
    btnGuardar.addEventListener("click", guardarNotaRubrica);
    var btnCerrar = document.createElement("button");
    btnCerrar.className = "descartar";
    btnCerrar.textContent = "Cerrar";
    btnCerrar.addEventListener("click", ocultarPanelRubrica);
    pie.appendChild(btnGuardar);
    pie.appendChild(btnCerrar);
    elPanelRubrica.appendChild(pie);

    refrescarTotal();
    elPanelRubrica.hidden = false;
  }

  function guardarNotaRubrica(){
    var n = totalRubrica();
    var de = criteriosActuales().length;
    registrarTurno(n + " de " + de);
  }

  // --- panel privado del profe: Alt+P muestra quién es qué (se cierra solo).
  // Sirve para comprobar que los espacios al final de cada línea sí se
  // guardaron (a veces pegar desde otra app los borra). No hay ningún
  // letrero en la página que lo anuncie. ---
  var elPanelProfe = document.getElementById("panel-profe");
  var temporizadorPanel = null;

  function nombresPorGrupo(items, campo, orden){
    return orden.map(function(g){
      var nombres = items.filter(function(it){ return it[campo] === g.clave; })
        .map(function(it){ return campo === "nivel" ? it.label : it.full; });
      return '<div class="pp-linea"><b>' + g.titulo + " (" + nombres.length + "):</b> " +
        (nombres.join(", ") || "—") + "</div>";
    }).join("");
  }

  function ocultarPanelProfe(){
    elPanelProfe.hidden = true;
    clearTimeout(temporizadorPanel);
  }

  function mostrarPanelProfe(){
    var ests = itemsEstudiantes(textareaEstudiantes.value);
    var pregs = itemsPreguntas(textareaPreguntas.value);
    elPanelProfe.innerHTML =
      nombresPorGrupo(ests, "cat", [
        { clave: "aplicado", titulo: "Aplicados" },
        { clave: "normal", titulo: "Normales" },
        { clave: "tramposo", titulo: "Tramposos" }
      ]) +
      '<div class="pp-linea" style="margin-top:10px">Preguntas (números)</div>' +
      nombresPorGrupo(pregs, "nivel", [
        { clave: "facil", titulo: "Fáciles" },
        { clave: "normal", titulo: "Normales" },
        { clave: "dificil", titulo: "Difíciles" }
      ]);
    elPanelProfe.hidden = false;
    clearTimeout(temporizadorPanel);
    temporizadorPanel = setTimeout(ocultarPanelProfe, 8000);
  }

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ ocultarPanelProfe(); ocultarPanelRubrica(); }
    if (e.altKey && !e.ctrlKey && !e.metaKey && e.key.toLowerCase() === "r"){
      e.preventDefault();
      if (elPanelRubrica.hidden) mostrarPanelRubrica(); else ocultarPanelRubrica();
      return;
    }
    // con el panel abierto: 1-9 marcan puntos, Enter guarda la nota
    if (!elPanelRubrica.hidden && !e.altKey && !e.ctrlKey && !e.metaKey){
      var t = e.target;
      var escribiendo = t && (t.isContentEditable || t.tagName === "TEXTAREA" ||
        (t.tagName === "INPUT" && t.type !== "checkbox"));
      if (!escribiendo){
        if (/^[1-9]$/.test(e.key)){
          var cajas = elPanelRubrica.querySelectorAll("input[type=checkbox]");
          var caja = cajas[parseInt(e.key, 10) - 1];
          if (caja){ caja.checked = !caja.checked; caja.dispatchEvent(new Event("change")); }
        } else if (e.key === "Enter" && !(t && t.tagName === "BUTTON")){
          e.preventDefault();
          guardarNotaRubrica();
        }
      }
    }
    if (e.altKey && !e.ctrlKey && !e.metaKey && e.key.toLowerCase() === "p"){
      e.preventDefault();
      if (elPanelProfe.hidden) mostrarPanelProfe(); else ocultarPanelProfe();
    }
  });

  function renderBitacora(){
    var bitacora = cargar("ruleta_bitacora", []);
    var tbody = document.getElementById("tabla-bitacora");
    tbody.innerHTML = "";

    if (bitacora.length === 0){
      tbody.innerHTML = '<tr class="vacio-fila"><td colspan="5">Todavía no hay turnos registrados.</td></tr>';
      return;
    }

    bitacora.forEach(function(fila, i){
      var tr = document.createElement("tr");
      [i + 1, fila.estudiante, fila.pregunta, fila.nota, fila.hora].forEach(function(valor, col){
        var td = document.createElement("td");
        if (col === 2) td.className = "pregunta-col";
        if (col === 3) td.className = "nota";
        td.textContent = valor;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  document.getElementById("btn-copiar").addEventListener("click", function(){
    var bitacora = cargar("ruleta_bitacora", []);
    var texto = bitacora.map(function(f, i){
      return (i+1) + ". " + f.estudiante + " — " + f.pregunta + " — nota: " + f.nota + " (" + f.hora + ")";
    }).join("\n");
    if (!texto){ mostrarToast("La bitácora está vacía"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){
        mostrarToast("Bitácora copiada");
      }).catch(function(){
        mostrarToast("No se pudo copiar");
      });
    }
  });

  document.getElementById("btn-reiniciar").addEventListener("click", function(){
    if (!confirm("¿Reiniciar listas y borrar la bitácora? Esto no se puede deshacer.")) return;
    textareaEstudiantes.value = EJEMPLO_ESTUDIANTES.join("\n");
    textareaPreguntas.value = EJEMPLO_PREGUNTAS.join("\n");
    guardar("ruleta_estudiantes", EJEMPLO_ESTUDIANTES);
    guardar("ruleta_preguntas", EJEMPLO_PREGUNTAS);
    guardar("ruleta_bitacora", []);
    currentStudent = null;
    currentQuestion = null;
    salirModoGrande();
    renderTurno();
    renderBitacora();
    refrescarRuedas();
    mostrarToast("Todo reiniciado");
  });

  refrescarRuedas();
  renderTurno();
  renderBitacora();
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ ruedaEstudiantes.dibujar(); ruedaPreguntas.dibujar(); });
  }

})();
</script>
