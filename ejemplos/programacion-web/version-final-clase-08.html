<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Clase 8 · Mesa de billar v0 (versión final)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<script type="module">
  import * as THREE from "three";
  import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

  const TEXTURAS = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r169/examples/textures/";

  // ---------- Escena, cámara y renderer ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 6, 9);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ---------- Luces y entorno (para que las bolas brillen) ----------
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  const sol = new THREE.DirectionalLight(0xffffff, 2);
  sol.position.set(3, 6, 4);
  scene.add(sol);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.5;

  // ---------- Piso de madera con la textura repetida ----------
  const madera = new THREE.TextureLoader().load(TEXTURAS + "hardwood2_diffuse.jpg");
  madera.colorSpace = THREE.SRGBColorSpace;
  madera.wrapS = madera.wrapT = THREE.RepeatWrapping;
  madera.repeat.set(10, 10);

  const piso = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ map: madera, roughness: 0.7 })
  );
  piso.rotation.x = -Math.PI / 2;
  piso.position.y = -0.5;
  scene.add(piso);

  // ---------- Mesa: paño verde mate + bordes ----------
  const anchoMesa = 8, fondoMesa = 4;

  const pano = new THREE.Mesh(
    new THREE.BoxGeometry(anchoMesa, 0.3, fondoMesa),
    new THREE.MeshStandardMaterial({ color: 0x0b6e3a, roughness: 1, metalness: 0 })
  );
  pano.position.y = -0.15;
  scene.add(pano);

  const materialBorde = new THREE.MeshStandardMaterial({ color: 0x5a3210, roughness: 0.6 });
  const bordeLargo = new THREE.BoxGeometry(anchoMesa + 0.6, 0.5, 0.3);
  const bordeCorto = new THREE.BoxGeometry(0.3, 0.5, fondoMesa);
  [[0, -fondoMesa / 2 - 0.15], [0, fondoMesa / 2 + 0.15]].forEach(([x, z]) => {
    const b = new THREE.Mesh(bordeLargo, materialBorde);
    b.position.set(x, 0.05, z);
    scene.add(b);
  });
  [[-anchoMesa / 2 - 0.15, 0], [anchoMesa / 2 + 0.15, 0]].forEach(([x, z]) => {
    const b = new THREE.Mesh(bordeCorto, materialBorde);
    b.position.set(x, 0.05, z);
    scene.add(b);
  });

  // ---------- Bolas: brillantes y con barniz ----------
  const radio = 0.2;
  function crearBola(color, x, z) {
    const bola = new THREE.Mesh(
      new THREE.SphereGeometry(radio, 48, 48),
      new THREE.MeshPhysicalMaterial({ color, roughness: 0.15, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03 })
    );
    bola.position.set(x, radio, z);
    scene.add(bola);
    return bola;
  }

  const blanca = crearBola(0xffffff, -2, 0.5);
  crearBola(0xd62828, 1.5, -0.8);
  crearBola(0xffd166, 2.2, 0.3);
  crearBola(0x1d4ed8, 0.5, 1.2);

  // ---------- Rebote de la bola blanca (lo de la clase pasada) ----------
  const limiteX = anchoMesa / 2 - radio;
  const limiteZ = fondoMesa / 2 - radio;
  let velocidadX = 0.05;
  let velocidadZ = 0.032;

  function animar() {
    blanca.position.x += velocidadX;
    blanca.position.z += velocidadZ;

    if (Math.abs(blanca.position.x) > limiteX) velocidadX *= -1;
    if (Math.abs(blanca.position.z) > limiteZ) velocidadZ *= -1;

    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animar);
</script>

</body>
</html>
